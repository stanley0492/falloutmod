; FO4 Next · low — Target: 1080p @ 60 Hz — RX 6600 / GTX 1660 class (stable floor)
; Generated by tools/render_preset.py — do not hand-edit the fragments.
; Apply to User.ini (display/graphics) and System.ini (shadows/grass/water).

[Display]
iSizeWidth=1920
iSizeHeight=1080
iFullscreen=1
bForceWindowed=0

[Graphics]
bUseThreadedShaderCompilation=1
bEnableAnisotropicFiltering=1
uAnisotropicFilteringLevel=16

[Shadows]
bEnableShadows=1
iShadowMapBiasPercent=3
fNearPlaneShadowDepth=0.05
fFarPlaneShadowDepth=80
fMaxShadowFadeDistance=80
bEnableSoftShadows=1
fSoftShadowQuality=1.6

[Grass]
bEnableBladeGrass=1
iMaxBladesPerBucket=40
fGrassMaxDistance=60

[Particles]
iMaxDecalPerFrame=120
bEnableParticleImpacts=1
bEnableRandomParticleBirth=1

[Water]
bEnableWater=1

[General]
; Frame pacing: the plugin's watchdog (P0-a4) clamps to 60 Hz and the
; upscaler slot (P1-a1) is bound by the D3D11 proxy at launch — not INI.
iPresentInterval=0
