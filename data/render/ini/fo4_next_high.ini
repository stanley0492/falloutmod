; FO4 Next · high — Target: 4K @ 120 Hz — RTX 4080 / RX 7900 XT class
; Generated by tools/render_preset.py — do not hand-edit the fragments.
; Apply to User.ini (display/graphics) and System.ini (shadows/grass/water).

[Display]
iSizeWidth=3840
iSizeHeight=2160
iFullscreen=1
bForceWindowed=0

[Graphics]
bUseThreadedShaderCompilation=1
bEnableAnisotropicFiltering=1
uAnisotropicFilteringLevel=16

[Shadows]
bEnableShadows=1
iShadowMapBiasPercent=2
fNearPlaneShadowDepth=0.05
fFarPlaneShadowDepth=160
fMaxShadowFadeDistance=160
bEnableSoftShadows=1
fSoftShadowQuality=2.4

[Grass]
bEnableBladeGrass=1
iMaxBladesPerBucket=120
fGrassMaxDistance=90

[Particles]
iMaxDecalPerFrame=400
bEnableParticleImpacts=1
bEnableRandomParticleBirth=1

[Water]
bEnableWater=1

[General]
; Frame pacing: the plugin's watchdog (P0-a4) clamps to 120 Hz and the
; upscaler slot (P1-a1) is bound by the D3D11 proxy at launch — not INI.
iPresentInterval=0
