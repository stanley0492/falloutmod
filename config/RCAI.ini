[RCAI]
; ============================================================
; RCAI — Reactive Combat AI (F4SE plugin)
; FO4 Modernization Program · see docs/MODERNIZATION_ROADMAP.md
; Place next to RCAI.dll (Data/F4SE/Plugins). Game restart
; required after changes.
; ============================================================

; Master toggle for RCAI tick processing
bEnabled = 1

; Milliseconds between AI ticks (0 = every frame)
iUpdateIntervalMS = 100

; Enemy perception multiplier (1.0 = stock engine behaviour).
; Will drive the M1 perception module.
fPerceptionMult = 1.0

; Log every 1000 ticks to f4se.log
bDebugLogging = 0
